{% load static %}



	<div class="top-bar">
		<div class="container-fluid">
			<div class="row">
				<div class="col-md-6 col-sm-6">
					<div class="left-top">
						<div class="email-box">
							<a href="#"><i class="fa fa-envelope-o" aria-hidden="true"></i> {{setting.email}}</a>
						</div>
						<div class="phone-box">
							<a href="#"><i class="fa fa-phone" aria-hidden="true"></i> {{setting.phone}}</a>
						</div>
					</div>
				</div>
				<div class="col-md-6 col-sm-6">
					<div class="right-top">
						<div class="social-box">
							<ul>
								<li><a href="https://www.facebook.com/{{setting.facebook}}"><i class="fa fa-facebook-square" aria-hidden="true"></i></a></li>
								<li><a href="https://www.instagram.com/{{setting.instagram}}"><i class="fa fa-instagram" aria-hidden="true"></i></a></li>
								<li><a href="https://www.linkedin.com/{{setting.linkedIn}}"><i class="fa fa-linkedin-square" aria-hidden="true"></i></a></li>
								<li><a href="https://www.twitter.com/{{setting.twitter}}"><i class="fa fa-twitter-square" aria-hidden="true"></i></a></li>
								<li><a href="https://www.telegram.com/{{setting.telegram}}"><i class="fa fa-rss-square" aria-hidden="true"></i></a></li>
							</ul>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
    <header class="header header_style_01">
        <nav class="megamenu navbar navbar-default">
            <div class="container-fluid">
                <div class="navbar-header">
                    <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
                        <span class="sr-only">Toggle navigation</span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                    </button>
                    <a class="navbar-brand" href="index.html"><img src="{{setting.logo.url}}" alt="image" style="height: 120px; width: 300px"></a>
                </div>
                <div id="navbar" class="navbar-collapse collapse">
                    <ul class="nav navbar-nav navbar-right">
						<li class="nav-item dropdown">
							<a class="nav-link dropdown-toggle" href="#" id="dropdown-a" data-toggle="dropdown">Account</a>
							{%if user.is_authenticated%}
							<div class="dropdown-menu" aria-labelledby="dropdown-a">
								<a class="dropdown-item" href="/profile">MY Account</a><hr>
								<a class="dropdown-item" href="/logout">Log Out</a>
							</div>
							{%else%}
							<div class="dropdown-menu" aria-labelledby="dropdown-a">
								<a class="dropdown-item " href="/register">Create Account</a><hr>
								<a class="dropdown-item" href="/login">Login</a>

							</div>
							{%endif%}
						</li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
