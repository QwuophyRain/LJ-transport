<!DOCTYPE html>
{%load static%}
<html lang="en">


    <!-- Basic -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Mobile Metas -->
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">

     <!-- Site Metas -->
    <title>{% block title %}Home Page{% endblock %}</title>
    <meta name="keywords" content="{% block keywords %}Home Keywords{% endblock %}">
    <meta name="description" content="{% block description %}Home descriptions {% endblock %}">

    <!-- Site Icons -->
    <link rel="shortcut icon" href="{% static ''%}images/favicon2.ico" type="image/x-icon" style="height: 40px"/>
    <link rel="apple-touch-icon" href="{% static ''%}images/apple-touch-icon.png">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static ''%}css/bootstrap.min.css">
    <!-- Site CSS -->
    <link rel="stylesheet" href="{% static ''%}style.css">
    <!-- Responsive CSS -->
    <link rel="stylesheet" href="{% static ''%}css/responsive.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static ''%}css/custom.css">

    <!-- Modernizer for Portfolio -->
    <script src="{% static ''%}js/modernizer.js"></script>

    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
      <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

{% block head %}{% endblock %}
   </head>
   <!-- body -->
   <body class="main-layout">
      <!-- loader  -->
      <div class="loader_bg">
         <div class="loader"><img src="{%static ''%}images/loading.gif" alt="#" /></div>
      </div>
      <!-- end loader -->

    {% include 'header.html' %}

    {% block slider %}{% endblock %}

    {% block content %}{% endblock %}
    {% block foot %}{% endblock %}

   </body>
</html>
